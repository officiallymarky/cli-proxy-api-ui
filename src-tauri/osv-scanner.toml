reason = "zvariant 5.15.1 is unmaintained: it was merged into zbus as the `wire` module starting with zbus 6.0. It reaches the build only through zbus 5.19, which tauri-plugin-single-instance 2.5.5 (latest) pins. Revisit when the plugin moves to zbus 6."

